[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rrd-rubricbench-repro"
version = "0.1.0"
description = "A clean-room reproduction of Recursive Rubric Decomposition on RubricBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0.0",
  "numpy>=1.24",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

